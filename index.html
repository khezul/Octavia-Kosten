<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kostenbuch</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root { --red:#E31937; --dark:#0a0a0a; --card:#111; --border:#222; --text:#f0f0f0; --muted:#666; --green:#00e676; --blue:#64b4ff; --mono:'Space Mono',monospace; --sans:'Syne',sans-serif; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--dark); color:var(--text); font-family:var(--sans); min-height:100vh; padding:24px 16px 60px; }

  .header { text-align:center; margin-bottom:32px; }
  .logo { font-size:11px; letter-spacing:0.3em; color:var(--red); font-family:var(--mono); text-transform:uppercase; margin-bottom:12px; }
  h1 { font-size:clamp(2rem,8vw,3rem); font-weight:800; line-height:1; letter-spacing:-0.03em; }
  h1 span { color:var(--red); }
  .subtitle { font-family:var(--mono); font-size:11px; color:var(--muted); margin-top:10px; }

  .card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:20px 16px; margin-bottom:20px; }
  .section-title { font-size:14px; font-weight:700; margin-bottom:16px; display:flex; align-items:center; gap:8px; }
  .section-title::before { content:''; display:block; width:3px; height:14px; background:var(--red); border-radius:2px; }
  .section-title.blue::before { background:var(--blue); }

  /* BILANZ */
  .bilanz-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px; }
  .bilanz-block { border-radius:12px; padding:16px; text-align:center; }
  .bilanz-block.oct { background:rgba(227,25,55,0.08); border:1px solid rgba(227,25,55,0.2); }
  .bilanz-block.tsl { background:rgba(100,180,255,0.08); border:1px solid rgba(100,180,255,0.2); }
  .bilanz-label { font-family:var(--mono); font-size:9px; color:var(--muted); text-transform:uppercase; letter-spacing:0.15em; margin-bottom:8px; }
  .bilanz-value { font-family:var(--mono); font-size:clamp(1.2rem,5vw,1.8rem); font-weight:700; line-height:1; }
  .bilanz-value.red { color:var(--red); }
  .bilanz-value.blue { color:var(--blue); }
  .bilanz-diff { text-align:center; font-family:var(--mono); font-size:11px; color:var(--muted); padding:10px; background:#0a0a0a; border-radius:8px; }
  .bilanz-diff strong { color:var(--green); }

  /* INPUT */
  .input-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px; }
  .input-group { display:flex; flex-direction:column; gap:5px; }
  .input-group.full { grid-column:1/-1; }
  .input-group label { font-family:var(--mono); font-size:9px; letter-spacing:0.15em; color:var(--muted); text-transform:uppercase; }
  .input-group input, .input-group select { background:#0a0a0a; border:1px solid var(--border); border-radius:8px; color:var(--text); font-family:var(--mono); font-size:13px; padding:10px 12px; outline:none; width:100%; }
  .input-group input:focus, .input-group select:focus { border-color:var(--red); }
  .input-group select option { background:#111; }
  .btn { width:100%; border:none; border-radius:10px; color:#fff; font-family:var(--sans); font-size:14px; font-weight:700; padding:14px; cursor:pointer; margin-top:4px; }
  .btn.red { background:var(--red); }
  .btn.blue { background:#1a4a7a; border:1px solid var(--blue); color:var(--blue); }

  /* LOG */
  .log-entries { margin-top:16px; display:flex; flex-direction:column; gap:8px; max-height:320px; overflow-y:auto; }
  .log-entry { background:#0a0a0a; border:1px solid var(--border); border-radius:10px; padding:12px 14px; display:grid; grid-template-columns:1fr auto auto; gap:8px; align-items:center; }
  .log-entry.tesla-entry { border-color:rgba(100,180,255,0.2); }
  .entry-date { font-family:var(--mono); font-size:9px; color:var(--muted); margin-bottom:3px; }
  .entry-desc { font-size:13px; font-weight:700; line-height:1.3; }
  .entry-cat { font-family:var(--mono); font-size:9px; color:var(--muted); margin-top:2px; }
  .entry-amount { font-family:var(--mono); font-size:15px; font-weight:700; text-align:right; }
  .entry-amount.red { color:var(--red); }
  .entry-amount.blue { color:var(--blue); }
  .entry-del { background:none; border:none; color:var(--muted); cursor:pointer; font-size:14px; padding:4px; }

  .empty-state { text-align:center; padding:24px; font-family:var(--mono); font-size:11px; color:var(--muted); }
  .log-entries::-webkit-scrollbar { width:3px; }
  .log-entries::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }

  .tab-row { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:16px; }
  .tab-btn { padding:10px; border-radius:10px; border:1px solid var(--border); background:#0a0a0a; color:var(--muted); font-family:var(--mono); font-size:11px; cursor:pointer; text-align:center; transition:all 0.2s; }
  .tab-btn.active-oct { border-color:var(--red); color:var(--red); background:rgba(227,25,55,0.08); }
  .tab-btn.active-tsl { border-color:var(--blue); color:var(--blue); background:rgba(100,180,255,0.08); }

  .back-btn { display:block; text-align:center; margin-bottom:24px; font-family:var(--mono); font-size:11px; color:var(--muted); text-decoration:none; padding:10px; border:1px solid var(--border); border-radius:10px; }

  .motivation { text-align:center; padding:24px 16px; font-family:var(--mono); font-size:11px; color:var(--muted); line-height:1.8; }
  .motivation strong { color:var(--red); font-size:13px; }
</style>
</head>
<body>

<a class="back-btn" href="tesla-fund-tracker.html">&#8592; Zurück zum Tracker</a>

<div class="header">
  <div class="logo">&#9889; Kostenbuch</div>
  <h1>Octavia vs<br><span>Tesla</span></h1>
  <div class="subtitle">Was kostet dich jedes Auto wirklich?</div>
</div>

<!-- BILANZ -->
<div class="card">
  <div class="section-title">Gesamtbilanz</div>
  <div class="bilanz-grid">
    <div class="bilanz-block oct">
      <div class="bilanz-label">Octavia</div>
      <div class="bilanz-value red" id="oct-total">0,00 &#8364;</div>
    </div>
    <div class="bilanz-block tsl">
      <div class="bilanz-label">Tesla</div>
      <div class="bilanz-value blue" id="tsl-total">0,00 &#8364;</div>
    </div>
  </div>
  <div class="bilanz-diff" id="bilanz-diff">Noch keine Einträge.</div>
</div>

<!-- EINTRAG -->
<div class="card">
  <div class="section-title">Kosten eintragen</div>

  <div class="tab-row">
    <div class="tab-btn active-oct" id="tab-oct" onclick="setVehicle('oct')">&#128664; Octavia</div>
    <div class="tab-btn" id="tab-tsl" onclick="setVehicle('tsl')">&#9889; Tesla</div>
  </div>

  <div class="input-row">
    <div class="input-group">
      <label>Kategorie</label>
      <select id="in-cat">
        <option value="Wartung &#128295;">&#128295; Wartung</option>
        <option value="Reparatur &#128296;">&#128296; Reparatur</option>
        <option value="TÜV / HU &#128269;">&#128269; TÜV / HU</option>
        <option value="Reifen &#128280;">&#128280; Reifen</option>
        <option value="Versicherung &#128737;">&#128737; Versicherung</option>
        <option value="Laden &#9889;">&#9889; Laden</option>
        <option value="Sonstiges &#128203;">&#128203; Sonstiges</option>
      </select>
    </div>
    <div class="input-group">
      <label>Betrag &#8364;</label>
      <input type="number" id="in-amount" placeholder="z.B. 200" min="0" step="0.01">
    </div>
  </div>
  <div class="input-row">
    <div class="input-group full">
      <label>Beschreibung</label>
      <input type="text" id="in-desc" placeholder="z.B. Ölwechsel + Filter">
    </div>
  </div>
  <button class="btn red" id="add-btn" onclick="addCost()">+ Eintrag speichern</button>

  <div class="log-entries" id="log-entries">
    <div class="empty-state">Noch keine Einträge.</div>
  </div>
</div>

<div class="motivation">
  Jeder Euro den der Octavia dich kostet<br>ist ein Argument für den Juniper.<br>
  <strong>Zähl mit. &#9889;</strong>
</div>

<script>
var costs = JSON.parse(localStorage.getItem('tf-costs') || '[]');
var vehicle = 'oct';

function setVehicle(v) {
  vehicle = v;
  document.getElementById('tab-oct').className = 'tab-btn' + (v === 'oct' ? ' active-oct' : '');
  document.getElementById('tab-tsl').className = 'tab-btn' + (v === 'tsl' ? ' active-tsl' : '');
  document.getElementById('add-btn').className = 'btn ' + (v === 'oct' ? 'red' : 'blue');

  // Show/hide Laden option
  var catEl = document.getElementById('in-cat');
  for (var i = 0; i < catEl.options.length; i++) {
    if (catEl.options[i].value.indexOf('Laden') > -1) {
      catEl.options[i].style.display = v === 'tsl' ? '' : 'none';
    }
  }
  if (v === 'oct' && catEl.value.indexOf('Laden') > -1) catEl.selectedIndex = 0;
}

function addCost() {
  var amount = parseFloat(document.getElementById('in-amount').value);
  var desc = document.getElementById('in-desc').value.trim();
  var cat = document.getElementById('in-cat').value;
  if (!amount || amount <= 0) { alert('Bitte Betrag eingeben.'); return; }
  if (!desc) { alert('Bitte Beschreibung eingeben.'); return; }

  costs.unshift({
    id: Date.now(),
    date: new Date().toLocaleDateString('de-DE'),
    vehicle: vehicle,
    cat: cat,
    desc: desc,
    amount: amount
  });
  localStorage.setItem('tf-costs', JSON.stringify(costs));
  document.getElementById('in-amount').value = '';
  document.getElementById('in-desc').value = '';
  render();
}

function deleteCost(id) {
  costs = costs.filter(function(c) { return c.id !== id; });
  localStorage.setItem('tf-costs', JSON.stringify(costs));
  render();
}

function fmt(n) {
  return n.toLocaleString('de-DE', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' \u20AC';
}

function render() {
  var octTotal = 0, tslTotal = 0;
  costs.forEach(function(c) {
    if (c.vehicle === 'oct') octTotal += c.amount;
    else tslTotal += c.amount;
  });

  document.getElementById('oct-total').innerHTML = fmt(octTotal);
  document.getElementById('tsl-total').innerHTML = fmt(tslTotal);

  var diff = octTotal - tslTotal;
  var diffEl = document.getElementById('bilanz-diff');
  if (octTotal === 0 && tslTotal === 0) {
    diffEl.innerHTML = 'Noch keine Einträge.';
  } else if (diff > 0) {
    diffEl.innerHTML = 'Der Octavia hat dich bisher <strong>' + fmt(diff) + ' mehr</strong> gekostet als der Tesla.';
  } else if (diff < 0) {
    diffEl.innerHTML = 'Der Tesla hat bisher <strong>' + fmt(Math.abs(diff)) + ' mehr</strong> gekostet als der Octavia.';
  } else {
    diffEl.innerHTML = 'Beide Autos haben bisher gleich viel gekostet.';
  }

  var el = document.getElementById('log-entries');
  if (!costs.length) {
    el.innerHTML = '<div class="empty-state">Noch keine Einträge.</div>';
    return;
  }

  el.innerHTML = costs.map(function(c) {
    var isTesla = c.vehicle === 'tsl';
    return '<div class="log-entry' + (isTesla ? ' tesla-entry' : '') + '">' +
      '<div>' +
        '<div class="entry-date">' + c.date + ' · ' + (isTesla ? '&#9889; Tesla' : '&#128664; Octavia') + '</div>' +
        '<div class="entry-desc">' + c.desc + '</div>' +
        '<div class="entry-cat">' + c.cat + '</div>' +
      '</div>' +
      '<div class="entry-amount ' + (isTesla ? 'blue' : 'red') + '">' + fmt(c.amount) + '</div>' +
      '<button class="entry-del" onclick="deleteCost(' + c.id + ')">&#10005;</button>' +
    '</div>';
  }).join('');
}

// Init
setVehicle('oct');
render();
</script>
</body>
</html>
